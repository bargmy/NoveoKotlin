name: Android Build And Deliver

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      version_code: ${{ steps.release_meta.outputs.version_code }}
      tag: ${{ steps.release_meta.outputs.tag }}
      prerelease: ${{ steps.release_meta.outputs.prerelease }}
      release_name: ${{ steps.release_meta.outputs.release_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Derive release metadata
        id: release_meta
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          gradle_text = pathlib.Path("app/build.gradle.kts").read_text(encoding="utf-8")

          version_match = re.search(r'appVersionName\s*=\s*providers\.gradleProperty\("NOVEO_VERSION_NAME"\)\.orNull \?: "([^"]+)"', gradle_text)
          if not version_match:
              version_match = re.search(r'versionName\s*=\s*"([^"]+)"', gradle_text)
          if not version_match:
              raise SystemExit("Could not find base versionName in app/build.gradle.kts")

          version_code_match = re.search(r'appVersionCode\s*=\s*providers\.gradleProperty\("NOVEO_VERSION_CODE"\)\.orNull\?\.toIntOrNull\(\) \?: (\d+)', gradle_text)
          if not version_code_match:
              version_code_match = re.search(r'versionCode\s*=\s*(\d+)', gradle_text)
          if not version_code_match:
              raise SystemExit("Could not find base versionCode in app/build.gradle.kts")

          base_version = version_match.group(1).strip()
          base_version_code = int(version_code_match.group(1))

          latest_release_tag = ""
          latest_stable_tag = ""
          try:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/releases?per_page=100",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as resp:
                  releases = json.load(resp)
              for release in releases:
                  if release.get("draft"):
                      continue
                  if not latest_release_tag:
                      latest_release_tag = (release.get("tag_name") or "").strip()
                  if release.get("prerelease"):
                      continue
                  tag_name = (release.get("tag_name") or "").strip()
                  if re.fullmatch(r"\d+\.\d+\.\d+", tag_name):
                      latest_stable_tag = tag_name
                      break
          except Exception:
              pass

          is_prerelease = base_version == latest_stable_tag
          if is_prerelease:
              stamp = datetime.now(ZoneInfo("Asia/Tehran")).strftime("%-m%d%H%M")
              effective_version = f"{base_version}.{stamp}"
              version_code = int(stamp)
              tag = f"{base_version}-{stamp}"
              prerelease = "true"
              release_name = f"Noveo {tag}"
          else:
              effective_version = base_version
              version_code = base_version_code
              tag = base_version
              prerelease = "false"
              release_name = f"Noveo {base_version}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"version={effective_version}\n")
              fh.write(f"version_code={version_code}\n")
              fh.write(f"tag={tag}\n")
              fh.write(f"prerelease={prerelease}\n")
              fh.write(f"release_name={release_name}\n")
              fh.write(f"latest_release_tag={latest_release_tag}\n")
              fh.write(f"latest_stable_tag={latest_stable_tag}\n")
          PY

      - name: Generate Release Notes
        id: changelog
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_NAME: ${{ steps.release_meta.outputs.release_name }}
        run: |
          set -euo pipefail
          
          # Generate empty release-notes.md
          touch release-notes.md
          
          # Generate empty release-caption.txt
          touch release-caption.txt

      - name: Upload release metadata files
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: |
            release-notes.md
            release-caption.txt
          if-no-files-found: error

  build_minified:
    name: Build minified APKs
    runs-on: ubuntu-latest
    needs:
      - metadata
    env:
      APK_FOLDER: app/build/outputs/apk/release
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Gradle wrapper JAR
        shell: bash
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL "https://raw.githubusercontent.com/gradle/gradle/v8.14.4/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
          cache-read-only: false

      - name: Prepare Gradle command
        id: gradle_cmd
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "cmd=./gradlew" >> "$GITHUB_OUTPUT"
          else
            echo "cmd=gradle" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure minified ARM universal APKs
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          path = pathlib.Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          # ABI splits and ndk.abiFilters cannot be used together.
          # Remove the repo's abiFilters only in this temporary CI checkout.
          text = re.sub(
              r'\n\s*abiFilters \+= listOf\([^)]+\)',
              '',
              text,
          )

          if "splits {" not in text:
              splits = """
              splits {
                  abi {
                      isEnable = true
                      reset()
                      include("arm64-v8a", "armeabi-v7a")
                      isUniversalApk = true
                  }
              }

          """
              text = text.replace("    signingConfigs {", splits + "    signingConfigs {", 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Build minified ARM APKs
        shell: bash
        run: |
          set -o pipefail
          "${{ steps.gradle_cmd.outputs.cmd }}" \
            --build-cache \
            --configuration-cache \
            -PNOVEO_VERSION_NAME="${{ needs.metadata.outputs.version }}" \
            -PNOVEO_VERSION_CODE="${{ needs.metadata.outputs.version_code }}" \
            assembleFullRelease \
            assembleLiteRelease \
            -x lintVitalFullRelease \
            -x lintVitalLiteRelease \
            -x lintVitalReportFullRelease \
            -x lintVitalReportLiteRelease 2>&1 | tee build.log

      - name: Collect minified ARM APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob globstar

          for apk in app/build/outputs/apk/**/release/*.apk; do
            name="$(basename "$apk")"
            # Our custom naming in build.gradle.kts is:
            # ${baseName}-${appVersionName}-${abi}-${buildType}.apk
            # baseName is "noveo" or "noveo-lite"
            
            # Since we want to keep the RELEASE_TAG in the final name for consistency with existing CI logic:
            case "$name" in
              noveo-lite-*)
                flavor_prefix="noveo-lite"
                ;;
              noveo-*)
                flavor_prefix="noveo"
                ;;
              *)
                continue
                ;;
            esac

            case "$name" in
              *universal*)
                out="${flavor_prefix}-${RELEASE_TAG}.apk"
                ;;
              *arm64-v8a*)
                out="${flavor_prefix}-${RELEASE_TAG}-arm64-v8a-minified.apk"
                ;;
              *armeabi-v7a*)
                out="${flavor_prefix}-${RELEASE_TAG}-armeabi-v7a-minified.apk"
                ;;
              *)
                echo "Skipping unknown APK output: $name"
                continue
                ;;
            esac
            cp "$apk" "dist/$out"
          done

          ls -lh dist
          test -f "dist/noveo-${RELEASE_TAG}.apk"
          test -f "dist/noveo-lite-${RELEASE_TAG}.apk"
          test -f "dist/noveo-${RELEASE_TAG}-arm64-v8a-minified.apk"
          test -f "dist/noveo-lite-${RELEASE_TAG}-arm64-v8a-minified.apk"

      - name: Configure minified x86 APK
        shell: bash
        run: |
          git checkout -- app/build.gradle.kts
          python3 - <<'PY'
          import pathlib
          import re

          path = pathlib.Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          # ABI splits and ndk.abiFilters cannot be used together.
          # Remove the repo's abiFilters only in this temporary CI checkout.
          text = re.sub(
              r'\n\s*abiFilters \+= listOf\([^)]+\)',
              '',
              text,
          )

          if "splits {" not in text:
              splits = """
              splits {
                  abi {
                      isEnable = true
                      reset()
                      include("x86_64")
                      isUniversalApk = false
                  }
              }

          """
              text = text.replace("    signingConfigs {", splits + "    signingConfigs {", 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Build minified x86 APK
        shell: bash
        run: |
          set -o pipefail
          "${{ steps.gradle_cmd.outputs.cmd }}" \
            --build-cache \
            --configuration-cache \
            -PNOVEO_VERSION_NAME="${{ needs.metadata.outputs.version }}" \
            -PNOVEO_VERSION_CODE="${{ needs.metadata.outputs.version_code }}" \
            assembleFullRelease \
            assembleLiteRelease \
            -x lintVitalFullRelease \
            -x lintVitalLiteRelease \
            -x lintVitalReportFullRelease \
            -x lintVitalReportLiteRelease 2>&1 | tee -a build.log

      - name: Collect minified x86 APK
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar

          found=0
          for apk in app/build/outputs/apk/**/release/*x86_64*.apk; do
            name="$(basename "$apk")"
            flavor_prefix=$( [[ "$name" == noveo-lite-* ]] && echo "noveo-lite" || echo "noveo" )
            cp "$apk" "dist/${flavor_prefix}-${RELEASE_TAG}-x86_64-minified.apk"
            found=1
          done

          test "$found" -ge 1
          test -f "dist/noveo-${RELEASE_TAG}-x86_64-minified.apk"
          test -f "dist/noveo-lite-${RELEASE_TAG}-x86_64-minified.apk"
          ls -lh dist

      - name: Upload minified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: minified-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload minified build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: minified-build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore

  build_not_minified:
    name: Build not-minified ABI APKs
    runs-on: ubuntu-latest
    needs:
      - metadata
    env:
      APK_FOLDER: app/build/outputs/apk/release
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Gradle wrapper JAR
        shell: bash
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL "https://raw.githubusercontent.com/gradle/gradle/v8.14.4/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
          cache-read-only: false

      - name: Prepare Gradle command
        id: gradle_cmd
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "cmd=./gradlew" >> "$GITHUB_OUTPUT"
          else
            echo "cmd=gradle" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure not-minified split APKs
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          path = pathlib.Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          # ABI splits and ndk.abiFilters cannot be used together.
          # Remove the repo's abiFilters only in this temporary CI checkout.
          text = re.sub(
              r'\n\s*abiFilters \+= listOf\([^)]+\)',
              '',
              text,
          )

          text = text.replace("isMinifyEnabled = true", "isMinifyEnabled = false", 1)
          text = text.replace("isShrinkResources = true", "isShrinkResources = false", 1)

          if "splits {" not in text:
              splits = """
              splits {
                  abi {
                      isEnable = true
                      reset()
                      include("arm64-v8a", "armeabi-v7a", "x86_64")
                      isUniversalApk = false
                  }
              }

          """
              text = text.replace("    signingConfigs {", splits + "    signingConfigs {", 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Build not-minified ABI APKs
        shell: bash
        run: |
          set -o pipefail
          "${{ steps.gradle_cmd.outputs.cmd }}" \
            --build-cache \
            --configuration-cache \
            -PNOVEO_VERSION_NAME="${{ needs.metadata.outputs.version }}" \
            -PNOVEO_VERSION_CODE="${{ needs.metadata.outputs.version_code }}" \
            assembleFullRelease \
            assembleLiteRelease \
            -x lintVitalFullRelease \
            -x lintVitalLiteRelease \
            -x lintVitalReportFullRelease \
            -x lintVitalReportLiteRelease 2>&1 | tee build.log

      - name: Collect not-minified APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob globstar

          for apk in app/build/outputs/apk/**/release/*.apk; do
            name="$(basename "$apk")"
            flavor_prefix=$( [[ "$name" == noveo-lite-* ]] && echo "noveo-lite" || echo "noveo" )

            case "$name" in
              *arm64-v8a*)
                out="${flavor_prefix}-${RELEASE_TAG}-arm64-v8a-not-minified.apk"
                ;;
              *armeabi-v7a*)
                out="${flavor_prefix}-${RELEASE_TAG}-armeabi-v7a-not-minified.apk"
                ;;
              *x86_64*)
                out="${flavor_prefix}-${RELEASE_TAG}-x86_64-not-minified.apk"
                ;;
              *)
                echo "Skipping unknown APK output: $name"
                continue
                ;;
            esac
            cp "$apk" "dist/$out"
          done

          ls -lh dist
          test -f "dist/noveo-${RELEASE_TAG}-arm64-v8a-not-minified.apk"
          test -f "dist/noveo-lite-${RELEASE_TAG}-arm64-v8a-not-minified.apk"
          test -f "dist/noveo-${RELEASE_TAG}-armeabi-v7a-not-minified.apk"
          test -f "dist/noveo-lite-${RELEASE_TAG}-armeabi-v7a-not-minified.apk"
          test -f "dist/noveo-${RELEASE_TAG}-x86_64-not-minified.apk"
          test -f "dist/noveo-lite-${RELEASE_TAG}-x86_64-not-minified.apk"

      - name: Upload not-minified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: not-minified-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload not-minified build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: not-minified-build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore

  vital_lint:
    name: Vital release lint
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Gradle wrapper JAR
        shell: bash
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL "https://raw.githubusercontent.com/gradle/gradle/v8.14.4/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
          cache-read-only: false

      - name: Prepare Gradle command
        id: gradle_cmd
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "cmd=./gradlew" >> "$GITHUB_OUTPUT"
          else
            echo "cmd=gradle" >> "$GITHUB_OUTPUT"
          fi

      - name: Run vital release lint separately
        shell: bash
        run: |
          "${{ steps.gradle_cmd.outputs.cmd }}" \
            --build-cache \
            --configuration-cache \
            lintVitalFullRelease \
            lintVitalLiteRelease

  publish:
    name: Publish APKs
    runs-on: ubuntu-latest
    needs:
      - metadata
      - build_minified
      - build_not_minified
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-apks"
          path: dist
          merge-multiple: true

      - name: Download release metadata files
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: .

      - name: List APKs
        shell: bash
        run: |
          set -euo pipefail
          ls -lh dist
          test -f "dist/noveo-${RELEASE_TAG}.apk"
          test -f "dist/noveo-lite-${RELEASE_TAG}.apk"
          test -f "dist/noveo-${RELEASE_TAG}-arm64-v8a-minified.apk"
          test -f "dist/noveo-lite-${RELEASE_TAG}-arm64-v8a-minified.apk"
          test -f "dist/noveo-${RELEASE_TAG}-armeabi-v7a-minified.apk"
          test -f "dist/noveo-lite-${RELEASE_TAG}-armeabi-v7a-minified.apk"
          test -f "dist/noveo-${RELEASE_TAG}-x86_64-minified.apk"
          test -f "dist/noveo-lite-${RELEASE_TAG}-x86_64-minified.apk"

      - name: Sign APKs
        shell: bash
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          SIGN_KEYSTORE_PASSWORD: ${{ secrets.SIGN_KEYSTORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SIGN_KEYSTORE_BASE64}" ]; then
            echo "SIGN_KEYSTORE_BASE64 is empty, keeping Gradle-produced APK signatures."
            exit 0
          fi

          echo "$SIGN_KEYSTORE_BASE64" | base64 -d > release.keystore
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS_DIR="$(ls -d "${SDK_DIR}"/build-tools/* | sort -V | tail -n 1)"
          APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"
          ZIPALIGN="${BUILD_TOOLS_DIR}/zipalign"

          shopt -s nullglob
          for apk in dist/*.apk; do
            aligned="${apk%.apk}-aligned.apk"
            signed="${apk%.apk}-signed.apk"
            "$ZIPALIGN" -f -v 4 "$apk" "$aligned"
            "$APKSIGNER" sign \
              --ks release.keystore \
              --ks-pass pass:"$SIGN_KEYSTORE_PASSWORD" \
              --ks-key-alias "$SIGN_KEY_ALIAS" \
              --key-pass pass:"$SIGN_KEY_PASSWORD" \
              --out "$signed" "$aligned"
            mv "$signed" "$apk"
            rm -f "$aligned"
          done

      - name: Upload all APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: ${{ needs.metadata.outputs.release_name }}
          prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
          body_path: release-notes.md
          files: |
            dist/*.apk

      - name: Create high-compression delivery ZIPs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery

          zip -9 -j "delivery/noveo-${RELEASE_TAG}.zip" "dist/noveo-${RELEASE_TAG}.apk"
          zip -9 -j "delivery/noveo-lite-${RELEASE_TAG}.zip" "dist/noveo-lite-${RELEASE_TAG}.apk"
          zip -9 -j "delivery/noveo-${RELEASE_TAG}-arm64-v8a-minified.zip" "dist/noveo-${RELEASE_TAG}-arm64-v8a-minified.apk"
          zip -9 -j "delivery/noveo-lite-${RELEASE_TAG}-arm64-v8a-minified.zip" "dist/noveo-lite-${RELEASE_TAG}-arm64-v8a-minified.apk"

          ls -lh delivery

      - name: Send primary ZIPs to Telegram as one message
        continue-on-error: true
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram delivery is not configured, skipping."
            exit 0
          fi

          LITE_ZIP="delivery/noveo-lite-${RELEASE_TAG}-arm64-v8a-minified.zip"
          test -f "$LITE_ZIP"

          CAPTION="$(head -c 900 release-caption.txt 2>/dev/null || echo "Noveo release ${RELEASE_TAG}")"

          echo "Sending APK to Telegram..."
          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "caption=${CAPTION}" \
            -F "document=@${LITE_ZIP};filename=$(basename "$LITE_ZIP")" || true
